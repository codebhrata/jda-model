<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patna Land Feasibility Model</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d2320;--mut:#66706b;--ac:#1f6f5c;--bd:#dcdad2;--neg:#b3261e;--in:#fff8e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2421;--tx:#e8ece9;--mut:#93a09a;--ac:#5fc4a8;--bd:#333d38;--neg:#ff8a80;--in:#2a2a1c}}
:root[data-theme="dark"]{--bg:#141816;--card:#1e2421;--tx:#e8ece9;--mut:#93a09a;--ac:#5fc4a8;--bd:#333d38;--neg:#ff8a80;--in:#2a2a1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:6px}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:12px;padding:0 12px 24px;max-width:1300px;margin:auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
.f label{color:var(--mut);font-size:12.5px}
input,select{width:120px;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:4px 6px;font:inherit;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.k{border:1px solid var(--bd);border-radius:8px;padding:8px}.k b{display:block;font-size:18px}.k span{font-size:11px;color:var(--mut)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:4px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}.neg{color:var(--neg)}.pos{color:var(--ac)}.tot td{font-weight:700}
#verdict{padding:10px;border-radius:8px;font-weight:600;border:1px solid var(--bd)}
.note{font-size:12px;color:var(--mut)}
@media print{button,.inputs{display:none}.wrap{display:block}}
</style></head><body>
<header><h1>Patna Land Feasibility Model <span class="note">purchase · conversion (JDA) · loan</span></h1>
<div><button onclick="reset()">Reset</button><button onclick="window.print()">Print / PDF report</button></div></header>
<div class="wrap"><div class="inputs" id="inputs"></div><div id="out"></div></div>
<script>
const $=id=>document.getElementById(id);
const G=[
['Land & deal',[
['landQty','Land size',10],['landUnit','Unit',['kattha','decimal','m2','sqft','bigha','acre']],
['kSize','1 kattha = sqft',['1361.25','1371.25','720','1361']],
['purPct','% bought outright',60],['purRate','Purchase rate / kattha ₹',6800000],
['own','Landowner share on conversion %',55],['nonRate','NON / kattha (conversion) ₹',1000000],
['govRate','Govt rate / decimal ₹',2000000],['devAgPct','Reg. Dev. Agreement %',2],['brokPct','Broker % of land value',2],['gst','GST % on owner share value',0]]],
['Design & area',[
['far','FAR (1–3.5)',3],['floors','Floors',['1','2','3','4','5','6']],['commonK','Common area sqft / kattha',400],
['sa','Super area factor (1/loading)',0.75],['a2','2 BHK super area sqft',1220],['a3','3 BHK super area sqft',1440],['p3','% of 3 BHK',65]]],
['Sales',[
['rate','Sale rate ₹/sqft super',4000],['cc','Common charges ₹/flat',400000],['esc','Price escalation % p.a.',0],
['disc','Pre-booking discount % (Yr1)',0],['ss','Sales split Yr1..Yr6 %','5,15,20,20,20,20']]],
['Costs',[
['cons','Construction ₹/sqft built',1700],['cs','Construction split Yr1..3 %','34,33,33'],['cessPct','Labour cess %',1],
['cessBase','Cess base rate ₹/sqft',2760],['mapRate','Map sanction ₹/sqft',10],['prep','Site preparation ₹',200000]]],
['Finance',[['loanPct','Bank loan % of outflows',0],['loanRate','Loan interest % p.a.',12],['dr','Discount rate % (NPV)',15]]]];
const FL=[1,2,3,4,5,6].map(i=>i);
const D={};G.forEach(g=>g[1].forEach(f=>D[f[0]]=Array.isArray(f[2])?f[2][0]:f[2]));
let P={...D};try{Object.assign(P,JSON.parse(localStorage.getItem('jdaP')||'{}'))}catch(e){}
function build(){$('inputs').innerHTML=G.map(g=>`<div class="card"><h2>${g[0]}</h2>`+g[1].map(f=>{const v=P[f[0]];
 const ctl=Array.isArray(f[2])?`<select id="${f[0]}">${f[2].map(o=>`<option ${o==v?'selected':''} value="${o}">${f[0]=='floors'?'G+'+o:o}</option>`).join('')}</select>`:`<input id="${f[0]}" value="${v}">`;
 return `<div class="f"><label>${f[1]}</label>${ctl}</div>`}).join('')+'</div>').join('')+'<p class="note">Kattha varies by region (1361.25 Patna/central, 1371.25 per your note, 720 in parts of North Bihar) — verify locally. Yellow fields are inputs.</p>';
 document.querySelectorAll('input,select').forEach(e=>e.oninput=()=>{P[e.id]=e.value;try{localStorage.setItem('jdaP',JSON.stringify(P))}catch(x){}run()})}
function reset(){P={...D};try{localStorage.removeItem('jdaP')}catch(e){}build();run()}
const num=x=>+x||0,arr=s=>{const a=String(s).split(',').map(num),t=a.reduce((x,y)=>x+y,0)||1;return a.map(x=>x/t)};
function calc(q){
 const p={};for(const k in q)p[k]=isNaN(+q[k])||k=='ss'||k=='cs'?q[k]:+q[k];
 const U={sqft:1,m2:10.7639,decimal:435.6,kattha:p.kSize,bigha:20*p.kSize,acre:43560}[p.landUnit];
 const land=p.landQty*U,kat=land/p.kSize,purL=land*p.purPct/100,convL=land-purL;
 const landVal=purL/p.kSize*p.purRate,brok=p.brokPct/100*kat*p.purRate,non=convL/p.kSize*p.nonRate;
 const devAg=p.devAgPct/100*convL/435.6*p.govRate;
 const cons=p.far*land,N=p.floors,bupf=cons/N,cpf=p.commonK*kat/N,sbu=bupf-cpf,supf=sbu/p.sa;
 const avg=p.a2*(1-p.p3/100)+p.a3*p.p3/100,fpf=Math.floor(supf/avg+1e-9),flats=fpf*N;
 const vpf=avg*p.rate+p.cc,projVal=flats*vpf;
 const devF=flats*(purL/land)+flats*(convL/land)*(1-p.own/100),ownF=flats-devF;
 const gst=p.gst/100*ownF*vpf;
 const lc=p.cessPct/100*cons*p.cessBase,isc=lc/4,bf=isc/2,sh=bf/2,fire=bf,map=p.mapRate*cons;
 const mapTot=devAg+lc+isc+bf+sh+fire+map,consCost=p.cons*cons;
 const ss=arr(p.ss),cs=arr(p.cs),T=6,out=Array(T+1).fill(0),inn=Array(T+1).fill(0);
 out[0]=landVal+brok+non+mapTot+p.prep+gst;
 cs.forEach((w,i)=>{if(i<T)out[i+1]+=consCost*w});
 ss.forEach((w,i)=>{if(i<T)inn[i+1]=devF*vpf*w*Math.pow(1+p.esc/100,i)*(i==0?1-p.disc/100:1)});
 const rec=inn.reduce((a,b)=>a+b,0),exp=out.reduce((a,b)=>a+b,0);
 // loan
 let B=0,intr=0,eq=[],cumU=[],c=0,pay=null;const dr=[],bal=[];
 for(let t=0;t<=T;t++){const draw=p.loanPct/100*out[t],i=p.loanRate/100*(B+draw/2);intr+=i;
  const avail=Math.max(0,inn[t]-(out[t]-draw)),rep=Math.min(avail,B+draw+i);B=B+draw+i-rep;
  eq.push(inn[t]-out[t]+draw-rep);bal.push(B);c+=inn[t]-out[t];cumU.push(c);if(pay===null&&c>=0&&t>0)pay=t}
 const net=inn.map((v,i)=>v-out[i]);
 const npv=net.reduce((s,v,t)=>s+v/Math.pow(1+p.dr/100,t),0);
 let lo=-.9,hi=10;const f=r=>net.reduce((s,v,t)=>s+v/Math.pow(1+r,t),0);
 for(let i=0;i<80;i++){const m=(lo+hi)/2;f(m)>0?lo=m:hi=m}const irr=f(-.89)*f(9.9)<0?lo:NaN;
 const cumEq=[];let ce=0;eq.forEach(v=>{ce+=v;cumEq.push(ce)});
 return{land,kat,purL,convL,landVal,brok,non,devAg,lc,isc,bf,sh,fire,map,mapTot,cons,consCost,N,bupf,cpf,sbu,supf,avg,fpf,flats,vpf,projVal,devF,ownF,gst,rec,exp,profit:rec-exp,netProfit:rec-exp-intr,intr,margin:(rec-exp)/exp,net,out,inn,cumU,npv,irr,pay,peak:-Math.min(...cumU),eq,cumEq,bal,B,prep:p.prep,perSqft:exp/cons}}
const cr=x=>(x/1e7).toFixed(2)+' Cr',inr=x=>Math.round(x).toLocaleString('en-IN'),pc=x=>isNaN(x)?'n/a':(x*100).toFixed(1)+'%';
const cl=x=>x<0?'neg':'pos';
function run(){
 const r=calc(P);
 const v=r.margin>=.25?['Strong: margin ≥25% on cost — proceed to due diligence.','pos']:r.margin>=.15?['Acceptable: 15–25% margin; check sensitivity before committing.','']:['Weak: margin <15% — renegotiate land rate/NON or share.','neg'];
 const row=(a,b,c)=>`<tr${c?' class="tot"':''}><td>${a}</td><td>${b}</td></tr>`;
 const yrs=r.net.map((_,i)=>'Yr '+i);
 const mx=Math.max(...r.net.map(Math.abs),1);
 const bars=r.net.map((v,i)=>{const h=Math.abs(v)/mx*70,y=v>=0?90-h:90;return `<rect x="${20+i*95}" y="${y}" width="60" height="${h}" fill="${v>=0?'var(--ac)':'var(--neg)'}"/><text x="${50+i*95}" y="${v>=0?y-4:y+h+11}" font-size="10" text-anchor="middle" fill="var(--tx)">${(v/1e7).toFixed(1)}</text><text x="${50+i*95}" y="118" font-size="10" text-anchor="middle" fill="var(--mut)">${yrs[i]}</text>`}).join('');
 // scenarios
 const sc=[['Buy 100% land',{purPct:100}],['Current mix',{}],['All conversion (JDA)',{purPct:0}],['Current mix + 60% loan',{loanPct:60}]].map(([n,o])=>{const s=calc({...P,...o});return `<tr><td>${n}</td><td>${s.devF.toFixed(1)}</td><td>${cr(s.peak)}</td><td class="${cl(s.netProfit)}">${cr(s.netProfit)}</td><td>${pc(s.netProfit/(s.exp+s.intr))}</td><td>${pc(s.irr)}</td></tr>`}).join('');
 // sensitivity
 const cf=[.85,.92,1,1.08,1.15],rf=[.875,.9375,1,1.0625,1.125];
 const sens=`<tr><th>Constr ₹/sqft ↓ · Sale ₹/sqft →</th>${rf.map(x=>`<th>${inr(P.rate*x)}</th>`).join('')}</tr>`+cf.map(a=>`<tr><th>${inr(P.cons*a)}</th>`+rf.map(b=>{const s=calc({...P,cons:P.cons*a,rate:P.rate*b});return `<td class="${cl(s.netProfit)}">${cr(s.netProfit)}<br><small>${pc(s.margin)}</small></td>`}).join('')+'</tr>').join('');
 $('out').innerHTML=`
<div id="verdict" class="${v[1]}">${v[0]}</div><br>
<div class="kpis">
<div class="k"><span>Net profit (after interest)</span><b class="${cl(r.netProfit)}">${cr(r.netProfit)}</b></div>
<div class="k"><span>Margin on cost (pre-interest)</span><b>${pc(r.margin)}</b></div>
<div class="k"><span>Project IRR (unlevered)</span><b>${pc(r.irr)}</b></div>
<div class="k"><span>NPV @${P.dr}%</span><b class="${cl(r.npv)}">${cr(r.npv)}</b></div>
<div class="k"><span>Peak funding need</span><b>${cr(r.peak)}</b></div>
<div class="k"><span>Payback</span><b>${r.pay?'Year '+r.pay:'>6 yrs'}</b></div></div><br>
<div class="card"><h2>Area & units</h2><div class="scroll"><table>
${row('Total land (sqft) / kattha',inr(r.land)+' / '+r.kat.toFixed(2))}${row('Bought / conversion land (sqft)',inr(r.purL)+' / '+inr(r.convL))}
${row('Construction area (FAR × land)',inr(r.cons)+' sqft')}${row('BU area / floor · common / floor',inr(r.bupf)+' · '+inr(r.cpf))}
${row('Saleable BU / floor → Super area / floor',inr(r.sbu)+' → '+inr(r.supf))}${row('Avg flat (super) · flats/floor · total flats',inr(r.avg)+' · '+r.fpf+' · '+r.flats)}
${row('Developer flats · Landowner flats',r.devF.toFixed(1)+' · '+r.ownF.toFixed(1))}${row('Value per flat (incl. common chg)','₹'+inr(r.vpf))}${row('Total project value',cr(r.projVal),1)}</table></div></div>
<div class="card"><h2>Expenses</h2><div class="scroll"><table>
${row('Land purchase',inr(r.landVal))}${row('Brokerage',inr(r.brok))}${row('NON to landowners',inr(r.non))}
${row('Reg. Dev. Agreement',inr(r.devAg))}${row('Labour cess',inr(r.lc))}${row('Infra charge (LC/4)',inr(r.isc))}${row('Building fee (ISC/2)',inr(r.bf))}${row('Shelter charge (BF/2)',inr(r.sh))}${row('Fire sanction (=BF)',inr(r.fire))}${row('Map sanction',inr(r.map))}
${row('Total up to map sanction',inr(r.mapTot),1)}${row('Site prep + GST on owner share',inr(r.prep+r.gst))}${row('Construction',inr(r.consCost))}
${row('Total expenses (pre-interest)',inr(r.exp)+' (₹'+inr(r.perSqft)+'/sqft)',1)}${row('Developer receipts',inr(r.rec),1)}${row('Profit before interest',inr(r.profit),1)}${row('Loan interest',inr(r.intr))}</table></div></div>
<div class="card"><h2>Cash flow (₹ Cr, unlevered)</h2><svg viewBox="0 0 700 125" width="100%"><line x1="10" x2="690" y1="90" y2="90" stroke="var(--bd)"/>${bars}</svg>
<div class="scroll"><table><tr><th></th>${yrs.map(y=>`<th>${y}</th>`).join('')}</tr>
<tr><td>Outflow</td>${r.out.map(x=>`<td>${cr(x)}</td>`).join('')}</tr><tr><td>Inflow</td>${r.inn.map(x=>`<td>${cr(x)}</td>`).join('')}</tr>
<tr><td>Cumulative (unlevered)</td>${r.cumU.map(x=>`<td class="${cl(x)}">${cr(x)}</td>`).join('')}</tr>
<tr><td>Loan balance</td>${r.bal.map(x=>`<td>${cr(x)}</td>`).join('')}</tr><tr><td>Cumulative equity flow</td>${r.cumEq.map(x=>`<td class="${cl(x)}">${cr(x)}</td>`).join('')}</tr></table></div>
${r.B>1?'<p class="neg note">Loan not fully repaid by Year 6 — extend sales or cut loan %.</p>':''}</div>
<div class="card"><h2>Scenario comparison</h2><div class="scroll"><table><tr><th>Scenario</th><th>Dev. flats</th><th>Peak funding</th><th>Net profit</th><th>Return on cost</th><th>IRR</th></tr>${sc}</table></div></div>
<div class="card"><h2>Sensitivity: net profit (margin) — construction cost vs sale rate</h2><div class="scroll"><table>${sens}</table></div></div>
<p class="note">Calibrated to your sheet: labour cess uses base ₹2,760/sqft (back-solved from ₹11,26,908), map sanction ₹10/sqft (sheet result; label said 20), dev-agreement cost = 2% of govt-rate value of conversion land. "G+n" is treated as n floors as in your sheet. Estimates only; not legal or financial advice.</p>`}
build();run();
</script></body></html>
